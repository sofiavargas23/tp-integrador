<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión de Canchas y Turnos</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --dark: #1e293b;
            --light: #f8fafc;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f1f5f9; color: #334155; padding: 24px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        /* Encabezado */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid var(--border); }
        .header h1 { font-size: 26px; color: var(--dark); font-weight: 700; }
        .badge { background-color: #dcfce7; color: #166534; padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 13px; border: 1px solid #bbf7d0; }

        /* Pestañas */
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; background: #e2e8f0; color: #475569; transition: all 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; }

        /* Contenedores y Tarjetas */
        .grid { display: grid; grid-template-columns: 360px 1fr; gap: 24px; }
        @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
        
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid var(--border); }
        .card-header { padding: 14px 20px; font-weight: 600; font-size: 16px; color: white; background: var(--primary); }
        .card-header.dark { background: var(--dark); display: flex; justify-content: space-between; align-items: center; }
        .card-body { padding: 20px; }

        /* Formularios */
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #475569; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: var(--primary); ring: 2px solid #bfdbfe; }
        
        /* Botones */
        .btn { display: inline-block; width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-danger { background: #fee2e2; color: var(--danger); padding: 6px 12px; border-radius: 6px; border: 1px solid #fecaca; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-danger:hover { background: #fecaca; }
        .btn-refresh { background: transparent; border: 1px solid #64748b; color: white; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .btn-refresh:hover { background: #334155; }

        /* Tablas */
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f8fafc; padding: 12px 16px; font-size: 12px; color: #64748b; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        .tag { background: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .price { font-weight: 700; color: #15803d; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>⚽ Panel de Canchas y Turnos</h1>
            <p style="color: #64748b; font-size: 14px; margin-top: 4px;">Cargar, registrar, verificar y borrar registros en vivo</p>
        </div>
        <div class="badge">● Backend Conectado</div>
    </div>

    <!-- Selector de pestañas -->
    <div class="tabs">
        <button class="tab-btn active" onclick="mostrarTab('canchas')">Canchas</button>
        <button class="tab-btn" onclick="mostrarTab('clientes')">Clientes</button>
    </div>

    <!-- SECCIÓN CANCHAS -->
    <div id="seccion-canchas" class="grid">
        <div class="card">
            <div class="card-header">Registrar Nueva Cancha</div>
            <div class="card-body">
                <form id="formCancha">
                    <div class="form-group">
                        <label>Nombre de la cancha</label>
                        <input type="text" id="canchaNombre" placeholder="Ej: Cancha Central Fútbol 5" required>
                    </div>
                    <div class="form-group">
                        <label>Deporte</label>
                        <select id="canchaDeporte" required>
                            <option value="Fútbol">Fútbol</option>
                            <option value="Pádel">Pádel</option>
                            <option value="Tenis">Tenis</option>
                            <option value="Básquet">Básquet</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Precio por Hora ($)</label>
                        <input type="number" step="0.01" min="1" id="canchaPrecio" placeholder="Ej: 15000" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar Cancha</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header dark">
                <span>Canchas Registradas</span>
                <button class="btn-refresh" onclick="cargarCanchas()">Actualizar</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Deporte</th>
                        <th>Precio/Hora</th>
                        <th style="text-align: right;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaCanchas">
                    <tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 24px;">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- SECCIÓN CLIENTES -->
    <div id="seccion-clientes" class="grid" style="display: none;">
        <div class="card">
            <div class="card-header" style="background: var(--success);">Registrar Cliente</div>
            <div class="card-body">
                <form id="formCliente">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="clienteNombre" placeholder="Ej: Lucas Romero" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="tel" id="clienteTelefono" placeholder="Ej: 3825123456" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="background: var(--success);">Guardar Cliente</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header dark">
                <span>Clientes Registrados</span>
                <button class="btn-refresh" onclick="cargarClientes()">Actualizar</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th style="text-align: right;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaClientes">
                    <tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 24px;">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_CANCHAS = '/api/canchas';
    const API_CLIENTES = '/api/clientes';

    function mostrarTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if (tab === 'canchas') {
            document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
            document.getElementById('seccion-canchas').style.display = 'grid';
            document.getElementById('seccion-clientes').style.display = 'none';
            cargarCanchas();
        } else {
            document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
            document.getElementById('seccion-canchas').style.display = 'none';
            document.getElementById('seccion-clientes').style.display = 'grid';
            cargarClientes();
        }
    }

    // CARGAR Y LISTAR CANCHAS
    async function cargarCanchas() {
        try {
            const res = await fetch(API_CANCHAS);
            const canchas = await res.json();
            const tbody = document.getElementById('tablaCanchas');
            tbody.innerHTML = '';

            if (!canchas || canchas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 24px;">No hay canchas registradas.</td></tr>';
                return;
            }

            canchas.forEach(c => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>#${c.id}</strong></td>
                        <td style="font-weight: 600;">${c.nombre}</td>
                        <td><span class="tag">${c.deporte}</span></td>
                        <td class="price">$${c.precioHora}</td>
                        <td style="text-align: right;">
                            <button class="btn-danger" onclick="borrarCancha(${c.id})">Borrar</button>
                        </td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error(err);
        }
    }

    // REGISTRAR CANCHA (POST)
    document.getElementById('formCancha').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nuevaCancha = {
            nombre: document.getElementById('canchaNombre').value,
            deporte: document.getElementById('canchaDeporte').value,
            precioHora: parseFloat(document.getElementById('canchaPrecio').value)
        };

        const res = await fetch(API_CANCHAS, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(nuevaCancha)
        });

        if (res.ok) {
            document.getElementById('formCancha').reset();
            cargarCanchas();
        } else {
            alert('Error al registrar la cancha');
        }
    });

    // BORRAR CANCHA (DELETE)
    async function borrarCancha(id) {
        if (!confirm(`¿Eliminar la cancha #${id}?`)) return;
        const res = await fetch(`${API_CANCHAS}/${id}`, { method: 'DELETE' });
        if (res.ok) cargarCanchas();
        else alert('No se pudo borrar la cancha.');
    }

    // CARGAR Y LISTAR CLIENTES
    async function cargarClientes() {
        try {
            const res = await fetch(API_CLIENTES);
            const clientes = await res.json();
            const tbody = document.getElementById('tablaClientes');
            tbody.innerHTML = '';

            if (!clientes || clientes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 24px;">No hay clientes registrados.</td></tr>';
                return;
            }

            clientes.forEach(cl => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>#${cl.id}</strong></td>
                        <td style="font-weight: 600;">${cl.nombre}</td>
                        <td>${cl.telefono}</td>
                        <td style="text-align: right;">
                            <button class="btn-danger" onclick="borrarCliente(${cl.id})">Borrar</button>
                        </td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error(err);
        }
    }

    // REGISTRAR CLIENTE (POST)
    document.getElementById('formCliente').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nuevoCliente = {
            nombre: document.getElementById('clienteNombre').value,
            telefono: document.getElementById('clienteTelefono').value
        };

        const res = await fetch(API_CLIENTES, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(nuevoCliente)
        });

        if (res.ok) {
            document.getElementById('formCliente').reset();
            cargarClientes();
        } else {
            alert('Error al registrar el cliente');
        }
    });

    // BORRAR CLIENTE (DELETE)
    async function borrarCliente(id) {
        if (!confirm(`¿Eliminar el cliente #${id}?`)) return;
        const res = await fetch(`${API_CLIENTES}/${id}`, { method: 'DELETE' });
        if (res.ok) cargarClientes();
        else alert('No se pudo borrar el cliente.');
    }

    // Iniciar con las canchas
    cargarCanchas();
</script>
</body>
</html>
